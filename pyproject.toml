[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sp500-adr-replication"
version = "0.1.0"
description = "S&P 500 proxy replication via global ADRs — research study (Research Specification v1.2.1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Pinned to the environment the audit verified all results against (S0).
    "numpy==2.4.4",
    "pandas==3.0.2",
    "scipy==1.18.1",
    "scikit-learn==1.9.0",
    "torch==2.14.1",        # installed locally as 2.14.1+cpu (CPU-only wheel)
    "yfinance==1.7.0",
    "joblib==1.6.0",
    "matplotlib==3.10.8",
    "seaborn==0.13.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
