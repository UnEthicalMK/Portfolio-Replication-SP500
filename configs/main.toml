[benchmark]
primary = "^SP500TR"
price_check = "^GSPC"
investable_check = "SPY"

[download]
start = "2007-01-01"
end = "2023-12-31"

[universe]
manifest_path = "configs/universe.csv"
exchanges = ["NYSE", "NASDAQ", "NYSE American"]
allowed_security_types = ["common_stock", "adr", "foreign_ordinary"]
min_history_days = 252
min_median_dollar_volume = 5000000
liquidity_lookback_days = 252
min_valid_volume_fraction = 0.8

[folds]
estimation_days = 1260
validation_days = 252
test_days = 252
first_test_year = 2014
last_test_year = 2023

[optimizer]
k_set = [7, 10, 15, 20]
w_max = 0.15
alphas = [0.0001, 0.001, 0.01, 0.1]

[costs]
default_bps = 10

[sae]
latent_dim = 3
dropout = 0.1
noise_sigma = 0.01
reconstruction_weight = 0.25
l1_weight = 0.0005
learning_rate = 0.003
epochs = 300
patience = 30
seeds = [0, 1, 2]

[outputs]
directory = "data/results"
